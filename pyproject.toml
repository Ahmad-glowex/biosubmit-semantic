[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biosubmit-semantic"
version = "0.1.0"
description = "Rule-based pre-flight auditor for functional genomics metadata (GEO/SRA sample attributes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tashfiqur Rahman Sabbir" }]
keywords = ["bioinformatics", "GEO", "SRA", "metadata", "quality-control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Ahmad-glowex/biosubmit-semantic"

[project.scripts]
biosubmit = "biosubmit_semantic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
